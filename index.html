
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KR 코드 일괄 변환기</title>
<style>
  :root {
    color-scheme: light;
    --bg:#f5f7fb;
    --card:#fff;
    --ink:#172238;
    --muted:#64748b;
    --line:#dce3ed;
    --blue:#2457d6;
    --blue2:#1742b5;
  }
  * { box-sizing:border-box; }
  body {
    margin:0;
    padding:28px 16px 48px;
    background:var(--bg);
    color:var(--ink);
    font-family:system-ui,-apple-system,
      "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    font-size:16px;
  }
  main { max-width:850px; margin:auto; }
  h1 {
    font-size:clamp(23px,4vw,31px);
    margin:0 0 9px;
    letter-spacing:-.7px;
  }
  .intro {
    color:var(--muted);
    line-height:1.6;
    margin:0 0 25px;
  }
  .panel {
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:22px;
    box-shadow:0 3px 18px rgba(20,34,60,.04);
  }
  .field-label {
    display:block;
    font-weight:750;
    margin-bottom:10px;
  }
  textarea, input {
    font:inherit;
    color:var(--ink);
    border:1.5px solid #c7d2e1;
    border-radius:10px;
    background:white;
  }
  textarea {
    display:block;
    width:100%;
    min-height:190px;
    padding:14px;
    line-height:1.6;
    resize:vertical;
    overflow-wrap:anywhere;
  }
  textarea:focus, input:focus {
    outline:3px solid #b7cbff;
    border-color:var(--blue);
  }
  textarea[readonly] { background:#f8fbff; }
  .options {
    display:flex;
    align-items:flex-end;
    gap:12px;
    flex-wrap:wrap;
    margin:20px 0;
  }
  .target-field { flex:1 1 210px; }
  input {
    width:100%;
    height:49px;
    padding:0 14px;
    font-weight:700;
    letter-spacing:.5px;
  }
  .btn {
    border:0;
    border-radius:10px;
    min-height:49px;
    padding:12px 20px;
    font:inherit;
    font-weight:750;
    cursor:pointer;
  }
  .btn-primary {
    background:var(--blue);
    color:#fff;
  }
  .btn-primary:hover { background:var(--blue2); }
  .btn-secondary {
    background:#e9efff;
    color:var(--blue2);
  }
  .btn-secondary:hover { background:#dbe6ff; }
  .btn:focus-visible {
    outline:3px solid #97b4ff;
    outline-offset:2px;
  }
  .result-head {
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:10px;
  }
  .result-head .field-label { margin-bottom:0; }
  .count {
    color:#4b628a;
    font-size:14px;
  }
  .copy-row {
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-top:14px;
  }
  #status {
    min-height:24px;
    color:var(--muted);
    font-size:14px;
    line-height:1.5;
  }
  .hint {
    font-size:14px;
    margin-top:18px;
    color:var(--muted);
    line-height:1.7;
  }
  @media (max-width:530px) {
    body { padding:17px 12px 30px; }
    .panel { padding:16px; }
    textarea { min-height:210px; }
    .options { gap:11px; }
    .options .btn { flex:1 1 100%; }
    .copy-row .btn { width:100%; }
  }
</style>
</head>
<body>
<main>
  <h1>KR 코드 일괄 변환기</h1>
  <p class="intro">
    문장을 붙여넣고 새 코드를 지정하세요.
    문장 속 <b>kr00~kr99</b> 형식의 코드를
    모두 바꾸고, 결과를 복사할 수 있습니다.
  </p>

  <section class="panel">
    <label class="field-label" for="source">
      ① 원본 문장 붙여넣기
    </label>
    <textarea
      id="source"
      placeholder="여기에 링크나 문장을 붙여넣으세요.&#10;예: https://example.com/kr12/page&#10;예: https://example.com/KR34/page"
      spellcheck="false"></textarea>

    <div class="options">
      <div class="target-field">
        <label class="field-label" for="target">
          ② 변경할 새 코드
        </label>
        <input
          id="target"
          type="text"
          value="kr48"
          maxlength="4"
          autocapitalize="off"
          autocomplete="off"
          spellcheck="false"
          placeholder="예: kr48 또는 48">
      </div>
      <button
        class="btn btn-primary"
        id="convert"
        type="button">
        변환하기
      </button>
    </div>

    <div class="result-head">
      <label class="field-label" for="result">
        ③ 변환 결과
      </label>
      <span class="count" id="count">
        변경 0개
      </span>
    </div>

    <textarea
      id="result"
      readonly
      placeholder="변환한 내용이 여기에 표시됩니다."
      spellcheck="false"></textarea>

    <div class="copy-row">
      <span
        id="status"
        role="status"
        aria-live="polite"></span>
      <button
        class="btn btn-secondary"
        id="copy"
        type="button">
        결과 전체 복사하기
      </button>
    </div>

    <p class="hint">
      ※ 대소문자와 관계없이 KR 뒤에
      <b>숫자 두 자리</b>가 있는 코드를 찾습니다.
      원본의 <b>KR / kr</b> 대소문자는
      그대로 유지합니다.
      다른 글자는 변경하지 않습니다.
      변환과 복사는 이 기기 안에서 처리됩니다.
    </p>
  </section>
</main>

<script>
(() => {
  'use strict';

  const source = document.getElementById('source');
  const target = document.getElementById('target');
  const result = document.getElementById('result');
  const count = document.getElementById('count');
  const status = document.getElementById('status');
  const convertBtn = document.getElementById('convert');
  const copyBtn = document.getElementById('copy');

  function convert() {
    const typed = target.value.trim();
    const parsed = /^(?:kr)?(\d{2})$/i.exec(typed);

    if (!parsed) {
      status.textContent =
        '새 코드를 kr48 또는 48처럼 입력해 주세요 (숫자 두 자리).';
      target.focus();
      return false;
    }

    if (!source.value) {
      result.value = '';
      count.textContent = '변경 0개';
      status.textContent = '먼저 원본 문장을 붙여넣어 주세요.';
      source.focus();
      return false;
    }

    const digits = parsed[1];
    let changes = 0;

    const converted = source.value.replace(
      /kr\d{2}(?!\d)/gi,
      match => {
        const prefix = match.slice(0, 2);
        const replacement = prefix + digits;
        if (replacement !== match) changes++;
        return replacement;
      }
    );

    result.value = converted;
    count.textContent =
      '실제 변경 ' +
      changes.toLocaleString('ko-KR') + '개';

    status.textContent = changes
      ? '변환 완료. 복사 버튼을 누르세요.'
      : '완료. 변경할 코드가 없거나 이미 같은 코드입니다.';

    return true;
  }

  async function copyResult() {
    if (!result.value) {
      status.textContent = '먼저 변환하기를 눌러 주세요.';
      return;
    }

    try {
      if (navigator.clipboard &&
          navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(result.value);
      } else {
        throw new Error('clipboard API unavailable');
      }
      status.textContent =
        '복사 완료! 원하는 곳에 붙여넣으세요.';
    } catch (err) {
      result.focus();
      result.select();

      let copied = false;
      try {
        copied = document.execCommand('copy');
      } catch (_error) {
        copied = false;
      }

      status.textContent = copied
        ? '복사 완료! 원하는 곳에 붙여넣으세요.'
        : '결과가 선택되었습니다. 복사 메뉴 또는 Ctrl+C를 눌러 주세요.';
    }
  }

  convertBtn.addEventListener('click', convert);
  copyBtn.addEventListener('click', copyResult);

  target.addEventListener('keydown', event => {
    if (event.key === 'Enter') convert();
  });
})();
</script>
</body>
</html>
