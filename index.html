
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KR 코드 일괄 변환기</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:12px;
  background:#f4f6fa;color:#18243b;
  font:14px system-ui,"Malgun Gothic",sans-serif;
}
main{max-width:780px;margin:auto}
h1{font-size:21px;margin:2px 0 10px}
.panel{
  background:white;border:1px solid #dce3ed;
  border-radius:12px;padding:14px;
}
label{display:block;font-weight:700;margin-bottom:5px}
textarea,input{
  width:100%;border:1px solid #cbd5e1;
  border-radius:7px;padding:9px;
  font:14px system-ui,sans-serif;
  color:#172238;
}
textarea{
  height:90px;resize:vertical;
  line-height:1.45;
  display:block;
}
textarea[readonly]{background:#f8faff}
input{height:38px}
textarea:focus,input:focus{
  outline:2px solid #a6bfff;
  border-color:#3565d8;
}
.controls{
  display:flex;align-items:end;gap:7px;
  margin:10px 0;
}
.code-field{flex:1;min-width:0}
button{
  height:38px;border:0;border-radius:7px;
  padding:0 13px;white-space:nowrap;
  font:700 13px system-ui,sans-serif;
  cursor:pointer;
}
.primary{background:#2457d6;color:white}
.secondary{background:#e8edfa;color:#244d9c}
.copy{
  width:100%;margin-top:9px;
  background:#2457d6;color:white;
}
.result-head{
  display:flex;justify-content:space-between;
  align-items:center;margin-bottom:5px;
}
.result-head label{margin:0}
#status{font-size:12px;color:#546987}
@media(max-width:380px){
  body{padding:8px}
  .panel{padding:10px}
  button{padding:0 9px;font-size:12px}
  textarea{height:78px}
  h1{font-size:19px}
}
</style>
</head>
<body>
<main>
<h1>KR 코드 일괄 변환기</h1>

<div class="panel">
  <label for="source">① 원본 문장</label>
  <textarea id="source"
    placeholder="문장이나 링크를 붙여넣으세요."
    spellcheck="false"></textarea>

  <div class="controls">
    <div class="code-field">
      <label for="target">② 새 KR 코드</label>
      <input id="target" value="kr48"
        maxlength="4"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false">
    </div>
    <button class="primary" id="convert">
      변환하기
    </button>
    <button class="secondary" id="reset">
      초기화
    </button>
  </div>

  <div class="result-head">
    <label for="result">③ 변환 결과</label>
    <span id="status" role="status"
      aria-live="polite">변경 0개</span>
  </div>

  <textarea id="result" readonly
    placeholder="변환 결과가 표시됩니다."
    spellcheck="false"></textarea>

  <button class="copy" id="copy">
    결과 전체 복사하기
  </button>
</div>
</main>

<script>
(() => {
  "use strict";

  const source = document.getElementById("source");
  const target = document.getElementById("target");
  const result = document.getElementById("result");
  const status = document.getElementById("status");

  document.getElementById("convert")
    .addEventListener("click", convert);

  document.getElementById("reset")
    .addEventListener("click", reset);

  document.getElementById("copy")
    .addEventListener("click", copyResult);

  function convert() {
    const code = target.value.trim();
    const match = /^(?:kr)?(\d{2})$/i.exec(code);

    if (!match) {
      status.textContent = "코드 확인 필요";
      alert("kr48 또는 48처럼 입력해 주세요.");
      target.focus();
      return;
    }

    if (!source.value) {
      status.textContent = "원본을 입력하세요";
      source.focus();
      return;
    }

    const digits = match[1];
    let changes = 0;

    result.value = source.value.replace(
      /kr\d{2}(?!\d)/gi,
      oldCode => {
        const newCode = oldCode.slice(0, 2) + digits;
        if (newCode !== oldCode) changes++;
        return newCode;
      }
    );

    status.textContent =
      "변경 " + changes.toLocaleString("ko-KR") + "개";
  }

  function reset() {
    source.value = "";
    result.value = "";
    target.value = "kr48";
    status.textContent = "변경 0개";
    source.focus();
  }

  async function copyResult() {
    if (!result.value) {
      status.textContent = "변환 결과가 없습니다";
      return;
    }

    try {
      if (!navigator.clipboard?.writeText) {
        throw new Error("Clipboard unavailable");
      }

      await navigator.clipboard.writeText(result.value);
      status.textContent = "복사 완료!";
    } catch (error) {
      result.focus();
      result.select();

      let copied = false;
      try {
        copied = document.execCommand("copy");
      } catch (e) {
        copied = false;
      }

      status.textContent = copied
        ? "복사 완료!"
        : "선택된 내용을 직접 복사해 주세요.";
    }
  }
})();
</script>
</body>
</html>
