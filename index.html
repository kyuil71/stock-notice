
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KR 코드 5항목 변환기</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:12px;background:#f4f6fa;color:#18243b;font:13px system-ui,"Malgun Gothic",sans-serif}
  main{max-width:960px;margin:auto}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  h1{font-size:19px;margin:0}
  .target{display:flex;align-items:center;gap:7px;font-weight:700}
  .target input{width:75px;height:33px;padding:5px 8px;border:1px solid #cbd5e1;border-radius:7px;font:700 14px system-ui}
  .panel{padding:12px;background:white;border:1px solid #dce3ed;border-radius:12px}
  .head,.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px}
  .head{color:#4e6080;font-weight:700;margin:0 0 6px}
  .head div{padding-left:6px}
  .pair{margin-bottom:7px}
  .side{display:grid;align-items:center;gap:5px;min-width:0}
  .left{grid-template-columns:20px minmax(0,1fr) auto auto}
  .right{grid-template-columns:minmax(0,1fr) auto auto}
  .num{text-align:center;font-size:12px;font-weight:800;color:#6c7d95}
  textarea{display:block;width:100%;min-width:0;height:39px;min-height:39px;resize:none;overflow:auto;padding:9px 8px;border:1px solid #ccd5e2;border-radius:7px;color:#172238;background:#fff;font:13px/19px system-ui,"Malgun Gothic",sans-serif;white-space:pre-wrap}
  textarea[readonly]{background:#f6f9ff}
  textarea:focus,.target input:focus{outline:2px solid #9cb7ff;border-color:#3a66d8}
  button{height:35px;padding:0 9px;border:0;border-radius:7px;font:700 12px system-ui,"Malgun Gothic",sans-serif;white-space:nowrap;cursor:pointer}
  .convert{background:#2457d6;color:white}
  .reset{background:#e7ecf5;color:#33476a}
  .copy{background:#e5edff;color:#1948b5}
  .open{background:#e7f4ec;color:#16633a}
  button:focus-visible{outline:2px solid #7197ee;outline-offset:2px}
  #status{min-height:18px;margin:5px 0 0;color:#50617e;font-size:12px}
  @media(max-width:700px){
    body{padding:8px}
    .panel{padding:9px}
    .head{display:none}
    .pair{grid-template-columns:1fr;gap:4px;padding:5px 0;border-bottom:1px solid #e8edf4}
    .pair:last-of-type{border:0}
    .right{padding-left:25px}
    .side:before{display:none}
    textarea{height:36px;min-height:36px;padding:7px}
    button{height:33px;padding:0 7px;font-size:11px}
  }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>KR 코드 5항목 변환기</h1>
    <label class="target">변경할 코드 <input id="target" value="kr48" maxlength="4" placeholder="kr48" spellcheck="false" aria-label="변경할 KR 코드"></label>
  </div>
  <section class="panel">
    <div class="head"><div>원본 붙여넣기 · 변환 · 초기화</div><div>변환 결과 · 복사 · 웹사이트 열기</div></div>
    <div id="rows"></div>
    <p id="status" role="status" aria-live="polite">각 항목을 독립적으로 변환할 수 있습니다.</p>
  </section>
</main>
<script>
(() => {
  'use strict';
  const rows = document.getElementById('rows');
  const status = document.getElementById('status');
  const target = document.getElementById('target');

  // 다섯 항목을 같은 형태로 생성합니다.
  for (let i = 1; i <= 5; i++) {
    const pair = document.createElement('div');
    pair.className = 'pair';
    pair.innerHTML = `
      <div class="side left">
        <span class="num">${i}</span>
        <textarea class="source" aria-label="${i}번 원본" placeholder="${i}번 붙여넣기" spellcheck="false"></textarea>
        <button type="button" class="convert" data-action="convert">변환하기</button>
        <button type="button" class="reset" data-action="reset">초기화</button>
      </div>
      <div class="side right">
        <textarea class="result" aria-label="${i}번 변환 결과" placeholder="${i}번 변환 결과" readonly spellcheck="false"></textarea>
        <button type="button" class="copy" data-action="copy">복사하기</button>
        <button type="button" class="open" data-action="open">웹사이트 열기</button>
      </div>`;
    rows.appendChild(pair);
  }

  function getDigits() {
    const match = /^(?:kr)?(\d{2})$/i.exec(target.value.trim());
    return match ? match[1] : null;
  }

  function getWebsite(text) {
    // 여러 문장 속에 주소가 있으면 첫 번째 웹 주소를 사용합니다.
    const found = text.match(/https?:\/\/[^\s<>"'`]+|www\.[^\s<>"'`]+/i);
    if (!found) return null;
    const raw = found[0].replace(/[),.;!?]+$/, '');
    try {
      const url = new URL(/^www\./i.test(raw) ? 'https://' + raw : raw);
      return ['http:', 'https:'].includes(url.protocol) ? url.href : null;
    } catch { return null; }
  }

  rows.addEventListener('click', async (event) => {
    const button = event.target.closest('button[data-action]');
    if (!button) return;
    const pair = button.closest('.pair');
    const number = [...rows.children].indexOf(pair) + 1;
    const source = pair.querySelector('.source');
    const result = pair.querySelector('.result');
    const action = button.dataset.action;

    if (action === 'reset') {
      source.value = '';
      result.value = '';
      status.textContent = `${number}번 초기화 완료`;
      source.focus();
      return;
    }
    if (action === 'convert') {
      const digits = getDigits();
      if (!digits) {
        status.textContent = '새 코드는 kr48 또는 48처럼 숫자 두 자리로 입력하세요.';
        target.focus();
        return;
      }
      if (!source.value) {
        status.textContent = `${number}번 원본을 붙여넣어 주세요.`;
        source.focus();
        return;
      }
      let changes = 0;
      result.value = source.value.replace(/kr\d{2}(?!\d)/gi, old => {
        const changed = old.slice(0, 2) + digits;
        if (changed !== old) changes++;
        return changed;
      });
      status.textContent = `${number}번 변환 완료 · ${changes}개 변경`;
      return;
    }
    if (!result.value) {
      status.textContent = `${number}번 결과가 없습니다. 먼저 변환해 주세요.`;
      return;
    }
    if (action === 'open') {
      const url = getWebsite(result.value);
      if (!url) {
        status.textContent = `${number}번 결과에 http:// 또는 https:// 웹 주소가 없습니다.`;
        return;
      }
      const tab = window.open(url, '_blank', 'noopener,noreferrer');
      status.textContent = `${number}번 웹사이트 열기 요청 완료 (팝업 차단 시 브라우저 설정 확인)`;
      return;
    }
    if (action === 'copy') {
      try {
        if (!navigator.clipboard?.writeText) throw new Error('clipboard unavailable');
        await navigator.clipboard.writeText(result.value);
        status.textContent = `${number}번 결과 복사 완료`;
      } catch {
        result.focus();
        result.select();
        let copied = false;
        try { copied = document.execCommand('copy'); } catch {}
        status.textContent = copied ? `${number}번 결과 복사 완료` : '결과가 선택되었습니다. 직접 복사해 주세요.';
      }
    }
  });
})();
</script>
</body>
</html>
